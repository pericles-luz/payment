openapi: 3.1.0
info:
  title: API de Pagamentos Sindireceita
  version: "1.1.0"
  summary: Cobrança e conciliação (PIX, boleto, checkout, DDA) sobre bancos do cliente.
  description: |
    API REST `/v1` que empresas usam como meio de cobrança sobre a **sua própria**
    credencial bancária (modelo PSP-Indireto — o dinheiro liquida direto na conta
    da empresa). Primeiro banco em produção: **C6**.

    Guia de integração/onboarding: `integration-guide.md` (mesma pasta).
    Manual de casos de uso end-to-end (cookbook com `curl` por caso):
    `manual.md` (mesma pasta) — cada caso referencia o `operationId` daqui.

    Além do plano `/v1` cliente-facing, este contrato documenta o **plano
    administrativo `/admin/*`** (tag `admin`, autenticado por token de admin —
    NÃO por token de empresa-cliente) e o **webhook inbound** de liquidação do
    C6 (tag `Webhooks`), do ponto de vista do integrador.

    Convenções globais:
    - **Autenticação:** `Authorization: Bearer <token>` em toda rota `/v1`. A
      empresa-cliente é derivada do token, nunca de um parâmetro. Token
      ausente/inválido → `401`.
      **Ressalva do caminho chave-de-Conta (revendedor, modelo b — ADR-0011):**
      quando o Bearer é uma **chave-de-Conta** (não um token de empresa-cliente),
      a empresa-cliente é escolhida por chamada no header `X-Client-Tenant`. Esse
      seletor é o **único mecanismo AUTORIZADO** de seleção, mediado pelo guard de
      autorização por-request (ADR-0011 §2): a chave só opera sobre
      empresas-clientes da **própria Conta**. Um token de empresa-cliente continua
      **sem** seletor — se um `X-Client-Tenant` for enviado com um token de
      empresa-cliente, é rejeitado (`400`). O caminho chave-de-Conta é
      **flag-gated, default-off** (`PAYMENT_ACCOUNT_KEY_SELECTOR`), habilitado por
      Conta; com a flag desligada o comportamento é idêntico ao modelo (a). Ver o
      esquema de segurança `accountKeyAuth`, o parâmetro `ClientSelector` e o
      runbook `docs/ops/runbook-verz-account-key-selector.md`.
    - **Valores monetários:** sempre em **centavos** (inteiro). R$ 10,00 → `1000`.
    - **Datas/hora:** RFC 3339 (ex. `2026-08-20T00:00:00-03:00`), exceto a janela
      do extrato que usa `YYYY-MM-DD`.
    - **Idempotência:** rotas de escrita exigem o header `Idempotency-Key`.
    - **Erros:** envelope uniforme `{ "error": "..." }` (não é RFC 7807; ver guia).
    - **Limites de entrada:** corpo até 1 MiB (`413` acima); campos JSON
      desconhecidos são rejeitados (`400`).
    - **Rate limit:** token-bucket por empresa (burst 20, 10 req/s) → `429`.
  contact:
    name: Suporte técnico Sindireceita
  license:
    name: Proprietária
servers:
  - url: https://api.pagamentos.sindireceita.example
    description: Produção (URL real definida por ambiente)
  - url: https://homolog.api.pagamentos.sindireceita.example
    description: Homologação

security:
  - bearerAuth: []

tags:
  - name: PIX
    description: Cobrança PIX imediata e com vencimento (cobv).
  - name: Recorrência
    description: >-
      PIX Automático (recorrência BACEN), flag-gated `PAYMENT_PIX_RECURRENCE`
      (default-off): mandato de débito recorrente (`rec`), solicitação de
      confirmação ao pagador (`solicrec`), cobranças de cada ciclo (`cobr`) e as
      locations de payload (`locrec`) que compõem o QR Code composto.
      A jornada implementada é a **Jornada 3** — um único QR que liquida a
      primeira cobrança e autoriza os débitos futuros.
  - name: Checkout
    description: Sessão de checkout hospedado (venda online).
  - name: Boleto
    description: Boletos BolePix com multa/juros/desconto.
  - name: DDA
    description: Consulta e pagamento de boletos no DDA / agendamento.
  - name: Extrato
    description: Extrato da conta por período.
  - name: Cobranças
    description: Cobrança genérica (compat).
  - name: Sistema
    description: Health check e provisionamento.
  - name: Revenda
    description: >-
      Modelo (b) revendedor (ADR-0011, flag-gated default-off): emissão/rotação
      da chave-de-Conta e provisionamento de empresas-clientes pela própria Conta.
  - name: Onboarding
    description: >-
      Intake self-serve de material bancário da própria empresa-cliente
      (flag-gated `PAYMENT_SELFSERVE_CRED_INTAKE`, default-off): credencial PSP e
      certificado mTLS enviados pela API, tenant = chamador autenticado (sem
      seletor → A01 eliminado por construção).
  - name: admin
    description: >-
      Plano administrativo `/admin/*` (interno — operado pela Sindireceita, NÃO
      exposto a empresas-clientes). Autenticado por **token de admin**
      (`adminAuth`), segregado do plano `/v1`: um token de empresa-cliente nunca
      resolve papel e é rejeitado (deny-by-default). Mutações exigem o papel
      `admin` completo; `operator` é somente-leitura. Cadastro de tenants, preço
      por rota (bilhetagem), material bancário e bootstrap de chave-de-Conta.
  - name: Webhooks
    description: >-
      Callback inbound de liquidação do C6 (`POST /webhooks/c6/{tenantRef}`).
      Documentado do ponto de vista do integrador/operador: autenticidade pela
      ref opaca no path, dedup e isolamento por tenant. Não é chamado pelas
      empresas-clientes — é o C6 que chama a Sindireceita.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [Sistema]
      summary: Health check (público)
      description: Única rota não autenticada. Não expõe segredos.
      security: []
      responses:
        "200":
          description: Serviço no ar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: v1.2.3 }
                  commit: { type: string, example: b1e1cbc }
                  built_at: { type: string, example: "2026-08-12T10:00:00Z" }

  /v1/charges:
    post:
      operationId: createCharge
      tags: [Cobranças]
      summary: Criar cobrança genérica
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChargeRequest" }
      responses:
        "201":
          description: Cobrança criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Charge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/charges/{id}:
    get:
      operationId: getCharge
      tags: [Cobranças]
      summary: Consultar cobrança
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Cobrança.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Charge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/pix:
    post:
      operationId: createPix
      tags: [PIX]
      summary: Criar cobrança PIX imediata
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePixRequest" }
      responses:
        "201":
          description: Cobrança PIX criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PixCharge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listPix
      tags: [PIX]
      summary: Listar cobranças PIX por período
      parameters:
        - name: start
          in: query
          required: true
          description: Início da janela (RFC 3339).
          schema: { type: string, format: date-time }
        - name: end
          in: query
          required: true
          description: Fim da janela (RFC 3339).
          schema: { type: string, format: date-time }
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Página de cobranças.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PixList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/pix/{txid}:
    get:
      operationId: getPix
      tags: [PIX]
      summary: Consultar cobrança PIX imediata
      parameters:
        - $ref: "#/components/parameters/PathTxid"
      responses:
        "200":
          description: Cobrança PIX (conciliada com o PSP).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PixCharge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/pix/cobv:
    post:
      operationId: createCobV
      tags: [PIX]
      summary: Criar cobrança PIX com vencimento (cobv)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CobVRequest" }
      responses:
        "201":
          description: Cobrança cobv criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CobV" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/pix/cobv/{txid}:
    get:
      operationId: getCobV
      tags: [PIX]
      summary: Consultar cobrança cobv
      parameters:
        - $ref: "#/components/parameters/PathTxid"
      responses:
        "200":
          description: Cobrança cobv.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CobV" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: updateCobV
      tags: [PIX]
      summary: Alterar cobrança cobv
      parameters:
        - $ref: "#/components/parameters/PathTxid"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CobVRequest" }
      responses:
        "200":
          description: Cobrança cobv alterada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CobV" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/pix/locrec:
    post:
      operationId: createLocRec
      tags: [Recorrência]
      summary: Criar location de payload da recorrência
      description: >-
        Cria a *location* — a URL de onde o app do pagador lê os parâmetros da
        recorrência ao ler o QR composto. **Não tem corpo de requisição**: a
        location é emitida a partir da empresa autenticada, e não há campo que
        permita direcionar para onde o QR aponta. O `id` devolvido é o que se
        informa em `loc_id` ao criar o mandato.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Location criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocRec" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/RecurrenceUnavailable" }
  /v1/pix/locrec/{id}:
    get:
      operationId: getLocRec
      tags: [Recorrência]
      summary: Consultar location de payload
      parameters:
        - $ref: "#/components/parameters/PathLocRecID"
      responses:
        "200":
          description: Location (com o mandato vinculado, se houver).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocRec" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/RecurrenceUnavailable" }
  /v1/pix/locrec/{id}/idrec:
    delete:
      operationId: unlinkLocRec
      tags: [Recorrência]
      summary: Desvincular o mandato de uma location
      description: >-
        Solta a location para que possa ser reaproveitada por outro mandato — o
        caminho de recuperação depois de um mandato cancelado ou nunca autorizado.
        Idempotente.
      parameters:
        - $ref: "#/components/parameters/PathLocRecID"
      responses:
        "200":
          description: Location liberada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocRec" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/RecurrenceUnavailable" }

  /v1/pix/rec:
    post:
      operationId: createRec
      tags: [Recorrência]
      summary: Criar mandato de débito recorrente
      description: >-
        Registra o mandato (`rec`). Ele nasce **CRIADA e não é cobrável**: só
        depois que o pagador autorizar no app do próprio banco — e essa aprovação
        chegar pelo webhook conciliado — é que uma cobrança recorrente é aceita.
        Para a Jornada 3, informe `loc_id` (de `createLocRec`) e `journey_txid`
        (o `txid` de uma cobrança imediata **já criada**): é o `journey_txid` que
        amarra o primeiro pagamento à autorização no mesmo QR.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRecRequest" }
      responses:
        "201":
          description: Mandato criado (status CRIADA).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rec" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/RecurrenceUnavailable" }
  /v1/pix/rec/{idRec}:
    get:
      operationId: getRec
      tags: [Recorrência]
      summary: Consultar mandato (ou obter o QR composto)
      description: >-
        Sem parâmetros, concilia o estado do mandato com o PSP. Com `qr=true`,
        pede ao PSP que **componha o QR** e devolve o Pix Copia e Cola em `qr`.
        O `txid` é opcional: por padrão usa o `journey_txid` gravado na criação,
        de modo que a loja não precisa guardar o vínculo mandato→cobrança. Um
        `txid` explícito compõe a jornada correspondente (cobrança com vencimento
        ⇒ JORNADA_4). Responde **409** quando o PSP ainda não tem tudo o que
        precisa para compor o QR — em vez de devolver um QR vazio, que apareceria
        quebrado para o pagador.
      parameters:
        - $ref: "#/components/parameters/PathIDRec"
        - name: qr
          in: query
          required: false
          description: "`true` pede a composição do QR."
          schema: { type: boolean, default: false }
        - name: txid
          in: query
          required: false
          description: Sobrepõe a cobrança que o QR composto liquida.
          schema: { type: string }
      responses:
        "200":
          description: Mandato (com `qr` quando solicitado e disponível).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rec" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: QR composto ainda não disponível para este mandato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "composite QR not available for this mandate yet" }
        "503": { $ref: "#/components/responses/RecurrenceUnavailable" }
    delete:
      operationId: cancelRec
      tags: [Recorrência]
      summary: Cancelar mandato
      description: >-
        Revoga o mandato no PSP para que nenhum débito futuro possa ser
        originado, e registra a transição CANCELADA. Idempotente.
      parameters:
        - $ref: "#/components/parameters/PathIDRec"
      responses:
        "200":
          description: Mandato cancelado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rec" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/RecurrenceUnavailable" }

  /v1/pix/solicrec:
    post:
      operationId: createSolicRec
      tags: [Recorrência]
      summary: Solicitar confirmação da recorrência ao pagador
      description: >-
        Jornada 1 (sem QR): envia o mandato para a instituição do pagador, que o
        apresenta para aceite no próprio app. `expires_at` é validado nesta API —
        deve estar no futuro e a menos de 30 dias (BACEN CMT-APR-SOLI-016).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSolicRecRequest" }
      responses:
        "201":
          description: Solicitação enviada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolicRec" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/RecurrenceUnavailable" }
  /v1/pix/solicrec/{idSolicRec}:
    get:
      operationId: getSolicRec
      tags: [Recorrência]
      summary: Consultar solicitação de confirmação
      parameters:
        - name: idSolicRec
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Situação da solicitação.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolicRec" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/RecurrenceUnavailable" }

  /v1/pix/cobr:
    post:
      operationId: createCobR
      tags: [Recorrência]
      summary: Originar cobrança recorrente do ciclo
      description: >-
        Cria uma cobrança contra um mandato **APROVADA**. Responde **409** se o
        mandato ainda não foi autorizado pelo pagador, ou se o valor excede o teto
        que ele autorizou — são conflitos de estado, não erros de payload.
        Idempotente pelo `txid`: reenviar o mesmo `txid` devolve a cobrança
        existente, sem segundo débito e sem segunda tarifação.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CobRRequest" }
      responses:
        "201":
          description: Cobrança recorrente criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CobR" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MandateConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/RecurrenceUnavailable" }
  /v1/pix/cobr/{txid}:
    get:
      operationId: getCobR
      tags: [Recorrência]
      summary: Consultar cobrança recorrente
      parameters:
        - $ref: "#/components/parameters/PathTxid"
      responses:
        "200":
          description: Cobrança (conciliada com o PSP).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CobR" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/RecurrenceUnavailable" }
    delete:
      operationId: cancelCobR
      tags: [Recorrência]
      summary: Cancelar uma cobrança do ciclo
      description: >-
        Cancela **uma** parcela sem tocar no mandato: a autorização do pagador
        continua de pé e os ciclos seguintes seguem cobrando. É a única alteração
        que o contrato BACEN admite numa cobrança recorrente — não há como mudar
        valor ou vencimento de uma parcela já criada. Para cobrar outro valor,
        cancele esta e crie uma nova; assim cada débito continua rastreável à
        cobrança que o autorizou, em vez de um mesmo `txid` significar dois
        valores diferentes. Idempotente. Não estorna um pagamento já liquidado.
      parameters:
        - $ref: "#/components/parameters/PathTxid"
      responses:
        "200":
          description: Cobrança cancelada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CobR" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/RecurrenceUnavailable" }
  /v1/pix/cobr/{txid}/retentativa/{data}:
    post:
      operationId: retryCobR
      tags: [Recorrência]
      summary: Solicitar retentativa de uma cobrança falhada
      description: >-
        Agenda a retentativa conforme a política de retentativa do mandato. O
        portão do mandato continua valendo: um mandato cancelado ou expirado não
        pode voltar a debitar um pagador que já revogou a autorização.
      parameters:
        - $ref: "#/components/parameters/PathTxid"
        - name: data
          in: path
          required: true
          description: Data da retentativa (yyyy-MM-dd).
          schema: { type: string, format: date }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_rec]
              properties:
                id_rec: { type: string, description: Mandato da cobrança. }
                bank: { type: string, description: "Banco (multi-banco, opcional)." }
      responses:
        "200":
          description: Retentativa agendada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CobR" }
