  /v1/account-key:
    post:
      operationId: rotateAccountKey
      tags: [Revenda]
      summary: Emitir/rotacionar a chave-de-Conta (modelo b, flag-gated)
      description: |
        **Modelo (b) — ADR-0011 §3. Flag-gated (`PAYMENT_ACCOUNT_KEY_SELECTOR`),
        default-off.** Emite uma nova chave-de-Conta e **invalida a anterior**
        (create==rotate idempotente, mesmo padrão de `PUT /v1/bank-credential`,
        SIN-69196). O segredo em claro (`ak_…`, ≥256-bit) é exibido **uma única
        vez** nesta resposta (display-once, ADR-0010): nunca é retornado de novo
        nem registrado em log; guarde-o em cofre no ato.

        Autenticação: pela **chave-de-Conta atual** (self-rotate) ou, para a
        **1ª chave** da Conta, por bootstrap do admin-plane (o board cadastra a
        Conta e emite a 1ª chave por canal seguro — mesma disciplina do
        `PAYMENT_CONSOLE_BOOTSTRAP_TOKEN`). Uma chave **não** pode emitir chave
        de outra Conta: a Conta é derivada do próprio Bearer, nunca de parâmetro.

        `Idempotency-Key` obrigatório (retentativa com a mesma chave não emite
        um segredo novo — devolve a operação original).
      security:
        - accountKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Nova chave emitida; a anterior foi invalidada. Segredo exibido UMA vez.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountKeyIssued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/clients:
    post:
      operationId: provisionClient
      tags: [Revenda]
      summary: Provisionar empresa-cliente da Conta (modelo b, flag-gated)
      description: |
        **Modelo (b) — ADR-0011 §4. Flag-gated (`PAYMENT_ACCOUNT_KEY_SELECTOR`),
        default-off.** Autenticada **pela chave-de-Conta**, cria uma
        empresa-cliente (tenant) já vinculada à Conta e devolve o `tenant_id`
        para uso no seletor `X-Client-Tenant`.

        **Segurança (A01/T6):** o `account_id` da nova empresa-cliente vem
        **sempre da chave** (server-side, imutável — invariante set-once,
        ADR-0009 §2). O corpo **não** aceita `account_id`; enviá-lo é ignorado/
        rejeitado. Assim uma Conta nunca provisiona empresa-cliente sob outra
        Conta.

        A credencial bancária da nova empresa-cliente segue por
        `PUT /v1/bank-credential` self-serve (SIN-69196), agora endereçável pelo
        seletor. `Idempotency-Key` obrigatório (dedup em retry).
      security:
        - accountKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClientRequest" }
      responses:
        "201":
          description: Empresa-cliente criada e vinculada à Conta da chave.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/bank-capabilities:
    get:
      operationId: getBankCapabilities
      tags: [Onboarding]
      summary: Quais formas de pagamento a conta bancária da própria empresa-cliente autoriza
      description: |
        Diz se a credencial bancária desta empresa-cliente autoriza cobrança por **PIX**
        e por **cartão**, para a loja oferecer só o que o banco vai aceitar.

        Existe por causa de uma compra que falhou no pior lugar possível: a conta de uma
        empresa não tinha o produto de checkout contratado, nada no sistema sabia disso,
        a loja mostrou o botão de cartão, e o comprador só descobriu quando o banco
        recusou — com o cartão na mão. A resposta aqui vem do escopo que o banco
        **concede** no token, que é o mesmo fato, sabido antes.

        O tenant vem do token; não há seletor no contrato, então um token só enxerga as
        próprias capacidades.

        `configured: false` significa "esta empresa ainda não tem credencial bancária" —
        estado normal de quem está configurando, e diferente de "configurou, mas a conta
        não contratou o produto". As duas situações pedem mensagens diferentes na tela,
        por isso são campos separados.

        Uma falha ao consultar o banco **não** vira `pode`: sobe como erro, para a tela
        dizer "não consegui verificar" em vez de habilitar o que seria recusado.
      security: [{ bearerAuth: [] }, { accountKeyAuth: [] }]
      responses:
        "200":
          description: Capacidades resolvidas
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, configured, pix, card]
                properties:
                  tenant_id: { type: string }
                  configured:
                    type: boolean
                    description: false quando a empresa-cliente ainda não tem credencial bancária
                  pix:
                    type: boolean
                    description: a conta autoriza criar cobrança PIX
                  card:
                    type: boolean
                    description: a conta autoriza abrir checkout de cartão
              examples:
                semCartao:
                  summary: Conta com PIX, sem o produto de checkout contratado
                  value: { tenant_id: "a58d…", configured: true, pix: true, card: false }
                naoConfigurada:
                  summary: Empresa-cliente ainda sem credencial
                  value: { tenant_id: "a58d…", configured: false, pix: false, card: false }
        "401": { description: Token ausente ou inválido }
        "503": { description: Consulta de capacidades não disponível nesta implantação }

  /v1/pix-key:
    put:
      operationId: setSelfServePixKey
      tags: [Onboarding]
      summary: Registrar a chave PIX de recebimento da própria empresa-cliente (flag-gated)
      description: |
        **Intake self-serve. Flag-gated (`PAYMENT_SELFSERVE_CRED_INTAKE`),
        default-off — com a flag desligada a rota não existe (`404`).**

        A empresa-cliente registra sua PRÓPRIA chave PIX de recebimento, autenticada
        pelo próprio token. Não há seletor de tenant no contrato: o tenant vem do
        token, então um token só consegue escrever a própria chave.

        **Ordem importa:** a chave é guardada junto da credencial, então
        `PUT /v1/bank-credential` precisa vir antes. Enviada antes, é recusada com
        `404`.

        **Write-only.** A chave não é segredo — é o identificador público da conta —,
        mas é dado de roteamento de fundos: a resposta nunca a devolve, para o
        endpoint não virar um jeito de descobrir para onde vai o dinheiro de alguém.

        Registrar a chave pode completar o par credencial+chave, e nesse momento os
        webhooks daquela empresa-cliente são registrados no banco automaticamente.
      security: [{ bearerAuth: [] }, { accountKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creditor_key]
              properties:
                creditor_key:
                  type: string
                  description: Chave PIX de recebimento (chave do recebedor).
                  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      responses:
        "200":
          description: Chave registrada. Idêntica para criação e substituição.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  status: { type: string, example: ok }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            Rota desligada pela flag, ou credencial ainda não gravada para esta
            empresa-cliente.

  /v1/bank-credential:
    put:
      operationId: setSelfServeBankCredential
      tags: [Onboarding]
      summary: Enviar/rotacionar a credencial bancária da própria empresa-cliente (flag-gated)
      description: |
        **Intake self-serve (SIN-69196). Flag-gated (`PAYMENT_SELFSERVE_CRED_INTAKE`),
        default-off — com a flag desligada a rota não existe (`404`).** A
        empresa-cliente envia/rotaciona sua PRÓPRIA credencial PSP (`client_id` +
        `secret`) autenticada pelo próprio token.

        **Segurança:** o tenant é o chamador autenticado (contexto), **nunca** vem
        do corpo/URL — não há seletor, então A01 é eliminado por construção.
        `bank` é opcional (default `c6`) e restrito à allow-list self-serve `{c6}`;
        qualquer outro → `400` sem eco do valor. O `secret` é **write-only**: nunca
        é logado, ecoado ou retornado (a resposta traz só metadados não-secretos).
        `create==rotate` (última escrita vence, resposta byte-idêntica → sem
        oráculo de existência). Limiter inbound dedicado por tenant emite
        `Retry-After` no `429`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfServeBankCredentialRequest" }
      responses:
        "200":
          description: Credencial armazenada (metadados não-secretos; sem o secret).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankCredentialView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/bank-certificate:
    put:
      operationId: setSelfServeBankCertificate
      tags: [Onboarding]
      summary: Enviar/rotacionar o certificado mTLS da própria empresa-cliente (flag-gated)
      description: |
        **Intake self-serve (SIN-69346). Mesma flag do intake de credencial
        (`PAYMENT_SELFSERVE_CRED_INTAKE`), default-off — desligada, a rota não
        existe (`404`).** A empresa-cliente envia/rotaciona seu PRÓPRIO certificado
        cliente mTLS (par `cert_pem`/`key_pem`) autenticada pelo próprio token.

        **Segurança:** o tenant é o chamador autenticado (contexto), **nunca** vem
        do corpo/URL — sem seletor, A01 eliminado por construção. `bank` opcional
        (default `c6`), restrito à allow-list self-serve `{c6}` (senão `400` sem
        eco). O par PEM é validado server-side (parse x509, casamento cert/chave,
        **rejeição de certificado expirado** → `400`, nunca `500`). A **chave
        privada** é **write-only**: nunca é logada, ecoada ou retornada — a
        resposta traz SÓ metadados públicos do certificado (fingerprint SHA-256,
        subject, janela de validade). `create==rotate` byte-idêntico (sem oráculo).
        Limiter inbound dedicado por tenant (bucket separado do intake de
        credencial) emite `Retry-After` no `429`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfServeBankCertificateRequest" }
      responses:
        "200":
          description: Certificado armazenado (só metadados públicos; nunca a chave privada).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankCertificateView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/statement:
    get:
      operationId: getStatement
      tags: [Extrato]
      summary: Extrato da conta por período
      description: Janela máxima de 30 dias; `fim` deve ser &gt;= `inicio`.
      parameters:
        - name: inicio
          in: query
          required: true
          description: Data inicial (YYYY-MM-DD, UTC).
          schema: { type: string, format: date, example: "2026-08-01" }
        - name: fim
          in: query
          required: true
          description: Data final (YYYY-MM-DD, UTC).
          schema: { type: string, format: date, example: "2026-08-30" }
      responses:
        "200":
          description: Lançamentos do período.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Statement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # Plano administrativo /admin/* (interno). adminAuth; mutações exigem papel
  # `admin`. Segregado do plano /v1 — um token de empresa-cliente é rejeitado.
  # ---------------------------------------------------------------------------
  /admin/tenants:
    post:
      operationId: adminCreateTenant
      tags: [admin]
      summary: Cadastrar uma empresa-cliente (tenant)
      description: >-
        Cria uma empresa-cliente no plano administrativo (modelo a / bootstrap).
        No modelo (b) a Conta provisiona suas próprias empresas-clientes via
        `POST /v1/clients` (operationId `provisionClient`).
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantRequest" }
      responses:
        "201":
          description: Empresa-cliente criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/tenants/{tenantID}/pricing:
    post:
      operationId: adminSetPrice
      tags: [admin]
      summary: Definir o preço (bilhetagem) de uma rota para a empresa-cliente
      description: >-
        Define o custo em centavos de um `endpoint` para a empresa-cliente
        (bilhetagem por rota × cliente). O consumo é medido no plano `/v1` e
        consolidado em faturas (console `/console`).
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/PathTenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPriceRequest" }
      responses:
        "200":
          description: Preço definido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Price" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/tenants/{tenantID}/bank-credential:
    put:
      operationId: adminSetBankCredential
      tags: [admin]
      summary: Gravar/rotacionar a credencial bancária de uma empresa-cliente
      description: >-
        Grava a credencial PSP (`client_id` + `secret`) da empresa-cliente para
        um banco. Equivalente admin do intake self-serve
        (`setSelfServeBankCredential`). O `secret` é **write-only**: nunca é
        retornado, logado ou ecoado — a resposta traz só campos não-secretos.
        `bank` opcional (default `c6`); banco desconhecido → `400`.
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/PathTenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSetBankCredentialRequest" }
      responses:
        "200":
          description: Credencial gravada (metadados não-secretos; sem o secret).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankCredentialView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/tenants/{tenantID}/bank-certificate:
    put:
      operationId: adminSetBankCertificate
      tags: [admin]
      summary: Gravar/rotacionar o certificado mTLS de uma empresa-cliente
      description: >-
        Grava o par certificado/chave mTLS (`cert_pem`/`key_pem`) da
        empresa-cliente para um banco. Equivalente admin do intake self-serve
        (`setSelfServeBankCertificate`). A **chave privada** é **write-only**:
        validada server-side (parse x509, casamento cert/chave, rejeição de
        expirado → `400`) e nunca retornada — a resposta traz só metadados
        públicos. `bank` opcional (default `c6`); banco desconhecido → `400`.
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/PathTenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSetBankCertificateRequest" }
      responses:
        "200":
          description: Certificado gravado (só metadados públicos; nunca a chave privada).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankCertificateView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /admin/accounts/{accountID}/account-key:
    post:
      operationId: adminMintAccountKey
      tags: [admin]
      summary: Emitir a 1ª chave-de-Conta (bootstrap, modelo b)
      description: |
        **Bootstrap admin (modelo b — ADR-0011 §3).** Um admin emite a PRIMEIRA
        chave-de-Conta de uma Conta nomeada (é assim que o board provisiona a
        1ª chave do Verz), entregue depois por canal seguro (nunca comentário
        público). Depois disso a Conta se auto-rotaciona via
        `POST /v1/account-key` (operationId `rotateAccountKey`).

        Usa o MESMO caminho `create==rotate`: chamar numa Conta que já tem chave
        **rotaciona** (override admin intencional). `Idempotency-Key`
        obrigatório; replay sob a mesma chave → `409` SEM o segredo
        (display-once). Se o emissor não estiver montado → `503`.
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/PathAccountID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Chave emitida; segredo exibido UMA vez.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountKeyIssued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >-
            Idempotency-Key já usado; o segredo é exibido só uma vez — rotacione
            com uma Idempotency-Key nova para um segredo novo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "idempotency key already used; the secret is shown only once — rotate with a fresh Idempotency-Key for a new secret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Emissão de chave-de-Conta indisponível (emissor não montado).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "account key issuance unavailable" }

  # ---------------------------------------------------------------------------
  # Webhook inbound de liquidação do C6. Chamado pelo C6, não pelo integrador.
  # ---------------------------------------------------------------------------
  /webhooks/c6/{tenantRef}:
    post:
      operationId: c6Webhook
      tags: [Webhooks]
      summary: Callback de liquidação do C6 (inbound, unsigned)
      description: |
        Notificação de liquidação enviada **pelo C6** para a Sindireceita. Não é
        chamado pelas empresas-clientes — está aqui para o integrador/operador
        entender o modelo de reconciliação.

        **Autenticidade:** o C6 não assina o callback (ADR-0002/F4); a
        autenticidade é a **ref opaca por-tenant no path** (`{tenantRef}`), um
        capability secret. Ref ausente/desconhecida/malformada → **`401`**
        uniforme (sem oráculo de existência de tenant). A ref NUNCA deve ir para
        log de proxy — mascare o segmento no ingress.

        **Corpo:** cap de 64 KiB (acima → `413`); JSON com campos desconhecidos
        rejeitado (`400`). O tenant vem SEMPRE da ref (canal), nunca do corpo;
        se o corpo trouxer um `client_id` divergente do canal → `401` (indicador
        de ataque, logado sem a ref/corpo). `external_id` vazio → `400`.

        **Dedup + reconcile-before-settle:** `event_key =
        external_id|service|status`; redeliveries exatas são suprimidas
        (`processed_events`, retenção indefinida — o contrato não assina
        timestamp). `service` seleciona o que reconciliar (`checkout`, `rec`,
        `cobr`, ou PIX/charge por padrão). `status` é **advisory** — a
        liquidação é decidida pela reconciliação autoritativa, nunca pelo corpo.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathTenantRef"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/C6WebhookNotification" }
      responses:
        "202":
          description: Aceito; reconciliação/liquidação já tentada de forma síncrona.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: Corpo acima do limite de 64 KiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "request body too large" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

# Callbacks que a Sindireceita ENTREGA no endpoint do integrador — a direção
# inversa de `paths`. Descrito aqui (OpenAPI 3.1 `webhooks`) para que um gerador
# produza o servidor do receptor, não um cliente. Guia: integration-guide.md §12.
webhooks:
  paymentPaid:
    post:
      operationId: outboundPaymentPaid
      summary: Notificação de liquidação entregue à Conta (assinada)
      description: >-
        Entregue no endpoint HTTPS cadastrado **por Conta** quando uma cobrança de
        qualquer empresa-cliente daquela Conta liquida. O corpo é deliberadamente
        mínimo — sem valor, pagador ou PII: para o detalhe, o receptor chama a API
        de volta com a chave-de-Conta e o `X-Client-Tenant` da empresa-cliente.
        **Não é autenticado por bearer**: a autenticidade vem do HMAC no header
        `X-Webhook-Signature`, que o receptor DEVE verificar antes de processar.
      security: []
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          schema: { type: string, pattern: "^sha256=[0-9a-f]{64}$" }
          description: >-
            `sha256=<hex>` — HMAC-SHA256, com o segredo de assinatura da Conta,
            sobre a string `"<X-Webhook-Timestamp>.<corpo bruto>"`. Compare em
            tempo constante e sobre os bytes recebidos: reserializar o JSON
            reordena campos e invalida o MAC.
          example: sha256=9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        - name: X-Webhook-Timestamp
          in: header
          required: true
          schema: { type: integer, format: int64 }
          description: >-
            Instante do envio em unix-seconds, incluído no conteúdo assinado.
            Rejeite fora de uma janela de frescor (recomendado 300 s) — com o
            timestamp dentro do MAC, isso derruba replay de um corpo capturado.
            Cada tentativa de reentrega re-assina com timestamp novo.
          example: 1755561600
        - name: X-Webhook-Idempotency-Key
          in: header
          required: true
          schema: { type: string }
          description: >-
            O `event_key` do evento, estável entre reentregas. Deduplique por ele:
            a mesma notificação pode chegar mais de uma vez (retry nosso ou
            reentrega do banco).
          example: E1234...|pix|CONCLUIDA
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutboundNotification" }
      responses:
        "2XX":
          description: >-
            Aceito. Responda assim que enfileirar — processe de forma assíncrona.
            Qualquer outro status (ou timeout) conta como falha: são até 3
            tentativas com backoff exponencial de 250 ms a 5 s e, esgotadas, o
            evento vai para dead-letter e não é reentregue automaticamente.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de API escopado por empresa-cliente (modelo a).
    accountKeyAuth:
      type: http
      scheme: bearer
      description: >-
        Chave-de-Conta (modelo b, ADR-0011, flag-gated default-off). Segredo
        opaco `ak_…` (≥256-bit) que identifica a **Conta** revendedora, não uma
        empresa-cliente. Exige o header `X-Client-Tenant` a cada chamada `/v1`
        para escolher a empresa-cliente-alvo (mediado pelo guard §2). Emitida/
        rotacionada via `POST /v1/account-key`.
    adminAuth:
      type: http
      scheme: bearer
      description: >-
        Token de **admin** do plano `/admin/*` (interno). Deny-by-default: um
        token de empresa-cliente ou uma chave-de-Conta nunca resolve papel de
        admin e é rejeitado. O papel `admin` autoriza mutações; `operator` é
        somente-leitura. Distribuído fora de banda pela Sindireceita; nunca
        em URL/log.

  parameters:
    ClientSelector:
      name: X-Client-Tenant
      in: header
      required: true
      description: >-
        Seletor da empresa-cliente-alvo (o `tenant_id` retornado por
        `POST /v1/clients`). Obrigatório **somente** no caminho chave-de-Conta
        (modelo b). Ausente numa chave-de-Conta → `400`. Enviado junto com um
        token de empresa-cliente (modelo a) → `400` (o token não tem autoridade
        de seleção). Empresa-cliente de outra Conta ou inexistente → `404`
        (mesma resposta, sem oráculo de enumeração cross-account). Nunca vai em
        query string/URL.
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave estável por intenção de negócio. Reenvio com a mesma chave não duplica o efeito.
      schema: { type: string, minLength: 1 }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
    PathTxid:
      name: txid
      in: path
      required: true
      schema: { type: string }
    PathIDRec:
      name: idRec
      in: path
      required: true
      description: Identificador BACEN do mandato de recorrência (29 caracteres).
      schema: { type: string }
    PathLocRecID:
      name: id
      in: path
      required: true
      description: Identificador da location de payload (inteiro atribuído pelo PSP).
      schema: { type: integer, format: int64 }
    PathTenantID:
      name: tenantID
      in: path
      required: true
      description: Identificador da empresa-cliente (tenant) alvo da operação administrativa.
      schema: { type: string }
    PathAccountID:
      name: accountID
      in: path
      required: true
      description: Identificador da Conta (revendedor) alvo do bootstrap de chave.
      schema: { type: string }
    PathTenantRef:
      name: tenantRef
      in: path
      required: true
      description: >-
        Ref opaca por tenant do callback (capability secret). É a ÚNICA
        credencial do webhook (o C6 não assina). Nunca deve aparecer em log de
        proxy/acesso.
      schema: { type: string }

  responses:
    BadRequest:
      description: Validação falhou, JSON malformado, campo desconhecido ou header obrigatório ausente.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            invalid: { value: { error: "invalid request" } }
            idem: { value: { error: "missing Idempotency-Key header" } }
    Unauthorized:
      description: Token ausente ou inválido.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "unauthorized" }
    Forbidden:
      description: >-
        Autenticado mas sem papel suficiente (ex.: token `operator` numa mutação
        do plano admin, que exige papel `admin`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "forbidden" }
    NotFound:
      description: Recurso inexistente ou pertencente a outra empresa (mesma resposta, para não vazar existência).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "not found" }
    Conflict:
      description: Conflito de estado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "conflict" }
    MandateConflict:
      description: >-
        Conflito de estado do mandato: ainda não autorizado pelo pagador
        (`APROVADA` pendente) ou valor acima do teto autorizado. O payload está
        correto — o que falta é a autorização, ou um valor menor.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            notApproved: { value: { error: "mandate is not approved" } }
            overCharge: { value: { error: "charge exceeds the authorized mandate value" } }
    RecurrenceUnavailable:
      description: >-
        Superfície de recorrência indisponível — o serviço não está ligado neste
        ambiente, ou a dependência bancária está fora do ar. É transitório e vale
        repetir depois.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "recurrence unavailable" }
    TooManyRequests:
      description: Rate limit excedido (burst 20, 10 req/s por empresa). Faça backoff.
    InternalError:
      description: Erro interno (transitório).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "internal error" }

  schemas:
    Error:
      type: object
      description: Envelope de erro uniforme (não é RFC 7807).
      required: [error]
      properties:
        error: { type: string, description: Mensagem curta e segura (sem detalhe interno). }

    LocRec:
      type: object
      description: Location de payload da recorrência — a URL que o QR composto aponta.
      required: [id, location]
      properties:
        id: { type: integer, format: int64, description: "Identificador da location, informado em `loc_id` ao criar o mandato." }
        location: { type: string, description: URL embutida no QR composto. }
        criacao: { type: string, format: date-time }
        id_rec: { type: string, description: Mandato vinculado à location (ausente quando livre). }

    RecDevedor:
      type: object
      description: Pagador vinculado ao mandato. `tax_id` com 11 dígitos é CPF, 14 é CNPJ.
      required: [tax_id, name]
      properties:
        tax_id: { type: string, description: "CPF (11) ou CNPJ (14), somente dígitos." }
        name: { type: string }

    CreateRecRequest:
      type: object
      description: >-
        Registro de um mandato de débito recorrente. Para a Jornada 3, `loc_id` e
        `journey_txid` são o que compõem o QR único (pagar agora + autorizar).
      required: [contrato, devedor, data_inicial, periodicidade, retry_policy]
      properties:
        contrato: { type: string, description: Contrato/pedido que o pagador reconhece. }
        objeto: { type: string, description: "Texto livre do objeto da recorrência. O PSP recusa espaços em branco." }
        devedor: { $ref: "#/components/schemas/RecDevedor" }
        data_inicial: { type: string, format: date, description: Data estimada do primeiro pagamento (yyyy-MM-dd). }
        periodicidade:
          type: string
          enum: [SEMANAL, MENSAL, TRIMESTRAL, SEMESTRAL, ANUAL]
        retry_policy:
          type: string
          description: Política de retentativa pós-vencimento.
          enum: [NAO_PERMITE, PERMITE_3R_7D]
        loc_id: { type: integer, format: int64, description: Location de `createLocRec`. Obrigatória para as jornadas com QR. }
        journey_txid:
          type: string
          description: >-
            `txid` de uma cobrança imediata **já criada**, que o QR composto
            liquida no mesmo gesto em que autoriza a recorrência (Jornada 3).
        amount_cents:
          type: integer
          format: int64
          description: >-
            Valor fixo de cada ciclo, em centavos. Omitido (0) = mandato de valor
            variável. Quando informado, vira o **teto** de toda cobrança do ciclo.
        bank: { type: string, description: "Banco (multi-banco, opcional)." }

    RecQR:
      type: object
      description: QR composto gerado pelo PSP.
      required: [jornada, pix_copia_e_cola]
      properties:
        jornada:
          type: string
          enum: [JORNADA_2, JORNADA_3, JORNADA_4]
          description: "Qual QR foi composto: mandato apenas, mandato + cobrança imediata, ou mandato + cobrança com vencimento."
        pix_copia_e_cola: { type: string, description: BR Code que o pagador lê. }

    Rec:
      type: object
      description: >-
        Mandato de débito recorrente. **Não** ecoa os dados do pagador: são a
        única PII de titular que o serviço guarda (ADR-0008) e nada nesta resposta
        precisa deles.
      required: [id_rec, status]
      properties:
        id_rec: { type: string }
        status:
          type: string
          enum: [CRIADA, APROVADA, REJEITADA, EXPIRADA, CANCELADA]
          description: "`CRIADA` **não** é cobrável — o pagador ainda não autorizou."
        journey_status:
          type: string
          description: "Estágio da jornada de ativação (ex.: `AGUARDANDO_DEFINICAO` até o pagador aprovar)."
        contrato: { type: string }
        data_inicial: { type: string, format: date }
        periodicidade: { type: string }
        retry_policy: { type: string }
        amount_cents: { type: integer, format: int64, description: Teto autorizado (ausente em mandato de valor variável). }
        loc_id: { type: integer, format: int64 }
        location: { type: string }
        qr: { $ref: "#/components/schemas/RecQR" }

    CreateSolicRecRequest:
      type: object
      description: Solicitação de confirmação do mandato à instituição do pagador (Jornada 1).
      required: [id_rec, tax_id, agencia, conta, ispb_participante, expires_at]
      properties:
        id_rec: { type: string }
        tax_id: { type: string, description: CPF (11) ou CNPJ (14) do pagador. }
        agencia: { type: string }
        conta: { type: string }
        ispb_participante: { type: string, description: ISPB da instituição do pagador. }
        expires_at:
          type: string
          format: date-time
          description: Expiração da solicitação (RFC 3339). Deve estar no futuro e a menos de 30 dias.
        bank: { type: string }

    SolicRec:
      type: object
      required: [id_solic_rec, id_rec, status]
      properties:
        id_solic_rec: { type: string }
        id_rec: { type: string }
        status: { type: string }
        expires_at: { type: string, format: date-time }

    CobRRequest:
      type: object
      description: >-
        Cobrança recorrente de um ciclo. Só é usada na CRIAÇÃO — uma cobrança já
        criada não pode ter valor nem vencimento alterados (ver `cancelCobR`).
      required: [id_rec, due_date, amount_cents]
      properties:
        id_rec: { type: string, description: Mandato APROVADA contra o qual cobrar. }
        txid:
          type: string
          description: >-
            Âncora anti-dupla-cobrança. Reenviar o mesmo `txid` devolve a mesma
            cobrança, sem segundo débito.
        due_date: { type: string, format: date, description: Data da cobrança (yyyy-MM-dd). }
        amount_cents: { type: integer, format: int64, description: Valor em centavos. Nunca pode exceder o teto do mandato. }
        bank: { type: string }

    CobR:
      type: object
      required: [txid, id_rec, status, amount_cents]
      properties:
        txid: { type: string }
        id_rec: { type: string }
        status:
          type: string
          description: >-
            Vocabulário BACEN da cobrança recorrente. `CONCLUIDA` é liquidada;
            `REJEITADA` é recusa do banco do pagador (cobre de novo / fale com o
            cliente); `CANCELADA` foi decisão sua.
          enum: [CRIADA, ATIVA, CONCLUIDA, EXPIRADA, REJEITADA, CANCELADA]
        due_date: { type: string, format: date }
        amount_cents: { type: integer, format: int64 }

    OutboundNotification:
      type: object
      description: >-
        Envelope canônico entregue no endpoint da Conta. Carrega apenas campos de
        roteamento/notificação — **nunca** valor, pagador ou qualquer PII que o
        payload PIX possa conter — nome, CPF/CNPJ e demais dados do devedor não
        trafegam aqui. Valor, parcelas e mensagem do PSP são enviados porque não
        identificam pessoa. Um receptor que precise do detalhe da cobrança chama a
        API de volta com sua chave-de-Conta. A ordem dos campos é estável, então os
        bytes assinados são exatamente os bytes transmitidos.
      required:
        [event_key, event_type, tx_id, account_id, timestamp, amount_cents, installments, message]
      properties:
        event_key:
          type: string
          description: >-
            Identificador de deduplicação, estável entre reentregas — o mesmo
            valor do header `X-Webhook-Idempotency-Key`.
          example: E1234...|pix|CONCLUIDA
        event_type:
          type: string
          description: Evento de negócio que ocorreu.
          example: payment.paid
        tx_id:
          type: string
          description: Identificador da cobrança referenciada, para consulta de volta na API.
          example: E1234...
        account_id:
          type: string
          description: >-
            Conta proprietária. Útil para quem opera mais de uma Conta contra o
            mesmo endpoint receptor.
          example: eddf5f171705697ad2fff7fb878ad948
        timestamp:
          type: integer
          format: int64
          description: >-
            Instante do envio em unix-seconds. Repete o header
            `X-Webhook-Timestamp`, que é o valor efetivamente usado na assinatura.
          example: 1755561600
        amount_cents:
          type: integer
          format: int64
          description: >-
            Valor liquidado em CENTAVOS (unidades menores inteiras). Nenhum valor
            cruza esta fronteira em reais: o PSP informa o valor do checkout como
            decimal em reais no fio ("amount": 5.01) e o adaptador converte para
            centavos por string, nunca por ponto flutuante. Não existe campo
            `amount` em reais neste corpo — diferença de arredondamento em valor é
            bug de dinheiro.
          example: 501
        installments:
          type: integer
          description: >-
            Em quantas parcelas a autorização do cartão foi dividida, para a empresa
            saber o que vai receber e quando. Zero em PIX e boleto, que não têm
            parcelamento. Sempre presente, para o schema ser estável.
          example: 3
        message:
          type: string
          description: >-
            Status da captura nas palavras do PSP. Vazio quando o PSP não disse nada
            (PIX, boleto). Sempre presente, para o schema ser estável.
          example: Transacao capturada com sucesso

    AccountKeyIssued:
      type: object
      description: >-
        Resultado da emissão/rotação da chave-de-Conta (modelo b). O campo
        `secret` traz o segredo em claro e aparece **uma única vez** — não é
        retornado em nenhuma outra chamada nem registrado em log. Uma emissão e
        uma rotação têm resposta byte-idêntica (`status: created`), sem oráculo
        de "a Conta já tinha chave".
      required: [account_id, secret, status]
      properties:
        account_id: { type: string, description: Identificador da Conta dona da chave. }
        secret:
          type: string
          description: Segredo em claro `ak_…` (≥256-bit). Guardar em cofre no ato; exibido só aqui.
          example: "ak_9f2c…redigido…"
        status: { type: string, enum: [created], description: "Sempre `created` (create==rotate; sem oráculo)." }

    CreateClientRequest:
      type: object
      description: >-
        Provisionamento de empresa-cliente (modelo b). NÃO aceita `account_id`:
        a Conta vem sempre da chave (server-side, imutável — A01/T6).
      properties:
        name: { type: string, description: Nome/label da empresa-cliente (opcional). }
    Client:
      type: object
      description: Empresa-cliente provisionada, já vinculada à Conta da chave.
      properties:
        tenant_id:
          type: string
          description: Identificador da empresa-cliente. Use-o no header `X-Client-Tenant`.
        account_id: { type: string, description: Conta dona (derivada da chave). }
        name: { type: string }

    SelfServeBankCredentialRequest:
      type: object
      description: >-
        Credencial PSP da própria empresa-cliente (intake self-serve). O tenant
        NÃO é um campo: vem do token autenticado. `secret` é write-only.
      required: [client_id, secret]
      properties:
        bank:
          type: string
          description: Slug do banco (opcional, default `c6`; allow-list self-serve `{c6}`).
          example: c6
        client_id: { type: string, description: Client id da credencial OAuth2 do PSP. }
        secret:
          type: string
          description: Secret da credencial. Write-only — nunca retornado, logado ou ecoado.
    BankCredentialView:
      type: object
      description: Confirmação de escrita da credencial — apenas campos NÃO-secretos (sem o secret).
      properties:
        tenant_id: { type: string }
        bank: { type: string, example: c6 }
        client_id: { type: string }
        status: { type: string, example: ok }

    SelfServeBankCertificateRequest:
      type: object
      description: >-
        Certificado cliente mTLS da própria empresa-cliente (intake self-serve). O
        tenant NÃO é um campo: vem do token autenticado. `key_pem` é write-only.
      required: [cert_pem, key_pem]
      properties:
        bank:
          type: string
          description: Slug do banco (opcional, default `c6`; allow-list self-serve `{c6}`).
          example: c6
        cert_pem: { type: string, description: Certificado leaf PÚBLICO em PEM. }
        key_pem:
          type: string
          description: >-
            Chave privada em PEM. Write-only — validada server-side, guardada no
            cofre e NUNCA retornada, logada ou ecoada. Envie somente sobre TLS.
    BankCertificateView:
      type: object
      description: >-
        Confirmação de escrita do certificado — apenas metadados PÚBLICOS. A chave
        privada nunca aparece aqui.
      properties:
        tenant_id: { type: string }
        bank: { type: string, example: c6 }
        subject_cn: { type: string }
        issuer: { type: string }
        serial_number: { type: string }
        fingerprint_sha256: { type: string, description: Fingerprint SHA-256 do certificado (id público). }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        status: { type: string, example: ok }

    Devedor:
      type: object
      description: >-
        Dados do devedor/pagador. Opcional na cobrança imediata. Na cobrança **com
        vencimento** (cobv) é obrigatório e exige o endereço completo — o banco recusa o
        registro sem `street`, `city`, `state` e `zip_code`, porque a cobv é um documento
        formal de cobrança entregue ao pagador.
      properties:
        tax_id: { type: string, description: CPF/CNPJ. }
        name: { type: string }
        street: { type: string, description: "Logradouro. Obrigatório na cobv." }
        city: { type: string, description: "Cidade. Obrigatório na cobv." }
        state: { type: string, description: "UF, 2 letras. Obrigatório na cobv." }
        zip_code: { type: string, description: "CEP, apenas dígitos. Obrigatório na cobv." }

    CreateChargeRequest:
      type: object
      required: [endpoint, amount_cents, currency]
      properties:
        endpoint: { type: string }
        amount_cents: { type: integer, format: int64, description: Valor em centavos. }
        currency: { type: string, example: BRL }
    Charge:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        endpoint: { type: string }
        amount_cents: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string }
        tx_id: { type: string }

    CreatePixRequest:
      type: object
      required: [amount_cents, currency, expires_in_seconds]
      properties:
        amount_cents: { type: integer, format: int64, description: Valor em centavos. }
        currency: { type: string, example: BRL }
        expires_in_seconds: { type: integer, format: int64 }
        devedor: { $ref: "#/components/schemas/Devedor" }
    PixCharge:
      type: object
      properties:
        txid: { type: string }
        status: { type: string }
        qr_code: { type: string, description: Payload EMV copia-e-cola. }
        qr_code_location: { type: string }
        expires_at: { type: string, format: date-time }
        amount_cents: { type: integer, format: int64 }
        received_amount_cents: { type: integer, format: int64 }
    PixList:
      type: object
      properties:
        charges:
          type: array
          items: { $ref: "#/components/schemas/PixCharge" }
        page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }

    CobVRequest:
      type: object
      required: [amount_cents, currency, due_date, validity_days, fine_bps, monthly_interest_bps, creditor_key, devedor]
      properties:
        amount_cents: { type: integer, format: int64, description: Valor em centavos. }
        currency: { type: string, example: BRL }
        due_date: { type: string, format: date-time }
        validity_days: { type: integer }
        fine_bps: { type: integer, format: int64, description: Multa por atraso em pontos-base. }
        monthly_interest_bps: { type: integer, format: int64, description: Juros mensais por atraso em pontos-base. }
        discount_bps: { type: integer, format: int64, description: Desconto por antecipação em pontos-base. }
        discount_fixed_cents: { type: integer, format: int64, description: Desconto fixo em centavos. }
        devedor: { $ref: "#/components/schemas/Devedor" }
        creditor_key:
          type: string
          description: >-
            Chave PIX do recebedor. Obrigatória: o banco recusa a cobrança com vencimento
            sem ela. Quando omitida, é resolvida da credencial da empresa-cliente; se
            também não houver ali, a chamada é recusada antes de ir ao banco.
    CobV:
      type: object
      properties:
        txid: { type: string }
        status: { type: string }
        qr_code: { type: string }
        qr_code_location: { type: string }
        due_date: { type: string, format: date-time }
        validity_days: { type: integer }
        fine_bps: { type: integer, format: int64 }
        monthly_interest_bps: { type: integer, format: int64 }
        discount_bps: { type: integer, format: int64 }
        discount_fixed_cents: { type: integer, format: int64 }
        amount_cents: { type: integer, format: int64 }
        received_amount_cents: { type: integer, format: int64 }

    CheckoutItem:
      type: object
      properties:
        description: { type: string }
        amount_cents: { type: integer, format: int64, description: Valor do item em centavos. }
    CreateCheckoutRequest:
      type: object
      required: [currency, items]
      description: Informe `expires_at` OU `expires_in_seconds`.
      properties:
        currency: { type: string, example: BRL }
        items:
          type: array
          items: { $ref: "#/components/schemas/CheckoutItem" }
        expires_at: { type: string, format: date-time }
        expires_in_seconds: { type: integer, format: int64 }
        card_type: { type: string, enum: [credit, debit] }
        require_authentication: { type: boolean }
        max_installments:
          type: integer
          minimum: 1
          maximum: 12
          default: 1
          description: >-
            Teto de parcelas oferecido ao comprador num cartão de CRÉDITO. Ausente ou
            zero significa pagamento à vista. Débito não parcela: `card_type: debit`
            com teto acima de 1 é recusado com 400.

            O comprador escolhe de 1x até este teto na página do banco.

            Cada parcela precisa ficar em pelo menos R$ 5,00, e o teto é reduzido
            automaticamente ao que o valor comporta (R$ 15,00 com teto de 6x abre com
            3x). A resposta traz o teto que de fato valeu.

            A faixa 1..12, a regra do débito e o mínimo por parcela são validados por
            NÓS: o PSP aceita tudo isso na criação e só recusa na página hospedada,
            com o comprador já no meio do pagamento.

            Os juros do parcelamento ficam por conta do COMPRADOR (o emissor do
            cartão), não da loja.
          example: 6
    CheckoutSession:
      type: object
      properties:
        session_id: { type: string }
        status: { type: string }
        redirect_url: { type: string, description: URL hospedada para redirecionar o comprador. }
        amount_cents: { type: integer, format: int64 }
        card_type: { type: string }
        require_authentication: { type: boolean }
        max_installments:
          type: integer
          description: >-
            O teto que foi PEDIDO na criação. Não confundir com `installments`
            abaixo, que é quantas parcelas o comprador de fato tomou.
          example: 6
        installments:
          type: integer
          description: >-
            Em quantas parcelas o comprador dividiu. Zero enquanto a sessão não foi
            paga.
          example: 3
        message:
          type: string
          description: Status da captura nas palavras do PSP. Vazio antes do pagamento.
          example: Transacao capturada com sucesso

    Address:
      type: object
      description: >-
        Endereço do pagador. Todos os campos são exigidos pelo banco na emissão do
        boleto — `neighborhood` inclusive, cuja ausência faz o registro ser recusado.
      required: [street, neighborhood, city, state, zip_code]
      properties:
        street: { type: string, description: "Logradouro. É enviado ao banco composto com o número." }
        number: { type: integer, description: Número do logradouro. }
        neighborhood: { type: string, description: Bairro. Obrigatório para emitir boleto. }
        city: { type: string }
        state: { type: string, description: "UF, 2 letras." }
        zip_code: { type: string, description: "CEP, apenas dígitos." }
    Payer:
      type: object
      required: [address]
      properties:
        name: { type: string }
        tax_id: { type: string, description: CPF/CNPJ. }
        address: { $ref: "#/components/schemas/Address" }
    DiscountTier:
      type: object
      description: Faixa de desconto por antecipação; informe exatamente um de bps ou fixed_cents.
      properties:
        days_before_due: { type: integer }
        bps: { type: integer, format: int64 }
        fixed_cents: { type: integer, format: int64 }
    CreateBoletoRequest:
      type: object
      required: [amount_cents, currency, due_date, fine_bps, monthly_interest_bps, payer, description]
      properties:
        amount_cents: { type: integer, format: int64, description: Valor em centavos. }
        currency: { type: string, example: BRL }
        due_date: { type: string, format: date-time }
        fine_bps: { type: integer, format: int64, description: Multa por atraso em pontos-base. }
        fine_fixed_cents: { type: integer, format: int64, description: Multa fixa em centavos. }
        monthly_interest_bps: { type: integer, format: int64, description: Juros mensais por atraso em pontos-base. }
        discounts:
          type: array
          items: { $ref: "#/components/schemas/DiscountTier" }
        payer: { $ref: "#/components/schemas/Payer" }
        description:
          type: string
          maxLength: 100
          description: >-
            Descrição da cobrança, impressa no boleto e vista pelo pagador. Obrigatória:
            o banco recusa o registro sem ela. Máximo de 100 caracteres.
          example: Mensalidade agosto/2026
    UpdateBoletoRequest:
      type: object
      required: [due_date]
      description: Alteração de vencimento/validade/valor/multa/juros/desconto (grupo 5).
      properties:
        amount_cents: { type: integer, format: int64 }
        currency: { type: string, example: BRL }
        due_date: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        fine_bps: { type: integer, format: int64 }
        fine_fixed_cents: { type: integer, format: int64 }
        monthly_interest_bps: { type: integer, format: int64 }
        discounts:
          type: array
          items: { $ref: "#/components/schemas/DiscountTier" }
    Boleto:
      type: object
      properties:
        boleto_id: { type: string }
        txid: { type: string }
        status: { type: string }
        qr_code: { type: string, description: Payload BolePix EMV copia-e-cola. }
        barcode: { type: string, description: Linha digitável. }
        our_number: { type: string, description: Nosso número. }
        digitable_line: { type: string }
        amount_cents: { type: integer, format: int64 }
        due_date: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        fine_bps: { type: integer, format: int64 }
        fine_fixed_cents: { type: integer, format: int64 }
        monthly_interest_bps: { type: integer, format: int64 }
        discounts:
          type: array
          items: { $ref: "#/components/schemas/DiscountTier" }

    DDABoleto:
      type: object
      properties:
        id: { type: string }
        barcode: { type: string, description: Linha digitável. }
        amount_cents: { type: integer, format: int64 }
        due_date: { type: string, format: date-time }
        beneficiary_name: { type: string }
    DDABoletoList:
      type: object
      properties:
        boletos:
          type: array
          items: { $ref: "#/components/schemas/DDABoleto" }
    DDAItem:
      type: object
      properties:
        id: { type: string }
        barcode: { type: string, description: Linha digitável. }
        amount_cents: { type: integer, format: int64 }
        due_date: { type: string, format: date-time }
    CreateDDAGroupRequest:
      type: object
      required: [barcodes]
      properties:
        barcodes:
          type: array
          items: { type: string, description: Linha digitável. }
    DDAGroup:
      type: object
      properties:
        txid: { type: string, description: Identificador do grupo para operações seguintes. }
        status: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/DDAItem" }
    DDAItemList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DDAItem" }
    RemoveDDAItemsRequest:
      type: object
      required: [item_ids]
      properties:
        item_ids:
          type: array
          items: { type: string }

    StatementEntry:
      type: object
      properties:
        id: { type: string }
        date: { type: string, format: date, description: YYYY-MM-DD. }
        amount_cents: { type: integer, format: int64 }
        kind: { type: string, description: Tipo do lançamento. }
        description: { type: string }
    Statement:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/StatementEntry" }

    # --- Plano administrativo /admin/* ---
    CreateTenantRequest:
      type: object
      description: Cadastro de empresa-cliente pelo plano admin.
      required: [name]
      properties:
        name: { type: string, description: Nome/label da empresa-cliente. }
    Tenant:
      type: object
      properties:
        id: { type: string, description: Identificador da empresa-cliente. }
        name: { type: string }
        active: { type: boolean }
    SetPriceRequest:
      type: object
      description: Preço (bilhetagem) de uma rota para a empresa-cliente.
      required: [endpoint, price_cents]
      properties:
        endpoint: { type: string, description: "Identificador da rota tarifada (ex.: `pix.create`)." }
        price_cents: { type: integer, format: int64, description: Custo em centavos por chamada da rota. }
    Price:
      type: object
      properties:
        tenant_id: { type: string }
        endpoint: { type: string }
        price_cents: { type: integer, format: int64 }
    AdminSetBankCredentialRequest:
      type: object
      description: >-
        Credencial PSP de uma empresa-cliente (plano admin). `secret` é
        write-only — nunca retornado, logado ou ecoado.
      required: [client_id, secret]
      properties:
        bank:
          type: string
          description: Slug do banco (opcional, default `c6`; desconhecido → 400).
          example: c6
        client_id: { type: string, description: Client id da credencial OAuth2 do PSP. }
        secret: { type: string, description: Secret da credencial. Write-only. }
    AdminSetBankCertificateRequest:
      type: object
      description: >-
        Certificado cliente mTLS de uma empresa-cliente (plano admin). `key_pem`
        é write-only — validado server-side e nunca retornado.
      required: [cert_pem, key_pem]
      properties:
        bank:
          type: string
          description: Slug do banco (opcional, default `c6`; desconhecido → 400).
          example: c6
        cert_pem: { type: string, description: Certificado leaf PÚBLICO em PEM. }
        key_pem: { type: string, description: Chave privada em PEM. Write-only; envie só sobre TLS. }

    # --- Webhook inbound do C6 ---
    C6WebhookNotification:
      type: object
      description: >-
        Corpo do callback de liquidação do C6. O tenant vem da ref no path, não
        daqui. Campos desconhecidos são rejeitados (`400`).
      required: [external_id]
      properties:
        external_id:
          type: string
          description: Id da cobrança no C6 (chave de reconciliação / txid).
        client_id:
          type: string
          description: >-
            Id do merchant no C6. Cross-checado contra o canal, nunca confiado;
            divergência → 401.
        service:
          type: string
          description: >-
            Seleciona o que reconciliar. Vazio/desconhecido → PIX/charge; valores
            especiais `checkout`, `rec`, `cobr`.
          example: pix
        status:
          type: string
          description: Advisory apenas — nunca decide a liquidação (reconciliação é autoritativa).
    WebhookAccepted:
      type: object
      properties:
        status: { type: string, enum: [accepted], description: Sempre `accepted` quando a reconciliação síncrona não falhou. }
