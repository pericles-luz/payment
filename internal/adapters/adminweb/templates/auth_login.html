{{define "auth_login"}}<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Pagamentos Admin</title>
<link rel="stylesheet" href="/console/static/tokens.css">
<link rel="stylesheet" href="/console/static/app.css">
</head>
<body>
<main class="auth" id="main">
  <div class="auth-card">
    <div class="brand">◆ Pagamentos · Admin</div>
    <h1>Entrar</h1>
    {{if .Error}}<p class="auth-error" role="alert">{{.Error}}</p>{{end}}
    <form method="post" action="/console/login">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <label for="username">Usuário</label>
      <input id="username" name="username" type="text" autocomplete="username" value="{{.Username}}" required autofocus>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <label for="totp">Código 2FA (TOTP)</label>
      <input id="totp" name="totp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" required>
      <button type="submit">Entrar</button>
    </form>
    {{if .BootstrapVisible}}<p class="auth-hint"><a href="/console/bootstrap">Primeiro acesso — provisionar credencial</a></p>{{end}}
  </div>
</main>
</body>
</html>{{end}}
