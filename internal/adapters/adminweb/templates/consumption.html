{{define "body"}}
<p class="breadcrumb"><a href="/console/tenants/{{.Tenant.ID}}" hx-get="/console/tenants/{{.Tenant.ID}}" hx-target="#main" hx-push-url="true">‹ {{.Tenant.Name}}</a> / Consumo</p>
<div class="topbar"><h1>Consumo &amp; auditoria</h1></div>

<nav class="tabs" aria-label="Seções do tenant">
  <a href="/console/tenants/{{.Tenant.ID}}" hx-get="/console/tenants/{{.Tenant.ID}}" hx-target="#main" hx-push-url="true">Visão geral</a>
  <a href="/console/tenants/{{.Tenant.ID}}/banks" hx-get="/console/tenants/{{.Tenant.ID}}/banks" hx-target="#main" hx-push-url="true">Bancos</a>
  <a href="/console/tenants/{{.Tenant.ID}}/pricing" hx-get="/console/tenants/{{.Tenant.ID}}/pricing" hx-target="#main" hx-push-url="true">Tarifação</a>
  <a href="/console/tenants/{{.Tenant.ID}}/consumption" aria-current="page">Consumo</a>
</nav>

<p class="muted">Agregação do ledger append-only (autoritativo para faturamento). Somente leitura.</p>

<form class="toolbar" method="get" action="/console/tenants/{{.Tenant.ID}}/consumption" role="search">
  <label for="start_date">De</label>
  <input id="start_date" type="date" name="start_date" value="{{.StartDate}}"
         hx-get="/console/tenants/{{.Tenant.ID}}/consumption/rows" hx-trigger="change"
         hx-target="#consumption-rows" hx-include="closest form" hx-indicator="#rows-indicator">
  <label for="end_date">Até</label>
  <input id="end_date" type="date" name="end_date" value="{{.EndDate}}"
         hx-get="/console/tenants/{{.Tenant.ID}}/consumption/rows" hx-trigger="change"
         hx-target="#consumption-rows" hx-include="closest form" hx-indicator="#rows-indicator">
  <noscript><button class="btn btn--secondary" type="submit">Filtrar</button></noscript>
  <span id="rows-indicator" class="htmx-indicator muted" role="status">Carregando…</span>
  <a class="btn btn--secondary" href="{{.CSVHref}}" download>Exportar CSV</a>
</form>

<div class="table-wrap" id="consumption-rows">
  {{template "consumption_rows" .}}
</div>
{{end}}
