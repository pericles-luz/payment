name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pin the Go toolchain deterministically to go1.26.6 across every job, independent
# of the actions/setup-go manifest (SIN-69227). setup-go's `1.26.x` selector may
# resolve to an older patch (e.g. 1.26.5) while the manifest lags a fresh go.dev
# release; setting GOTOOLCHAIN forces the `go` command to re-exec into exactly
# go1.26.6, so build/vet/test, staticcheck, and — critically — govulncheck all
# analyze the go1.26.6 stdlib (patched for GO-2026-6218/6091/6090). This is the
# authoritative pin; `go-version: 1.26.x` remains only as the setup-go bootstrap.
# Reversible: drop this block to fall back to whatever `1.26.x` resolves to.
env:
  GOTOOLCHAIN: go1.26.6

jobs:
  build-test:
    name: build, vet, test, coverage
    runs-on: ubuntu-latest

    # The PostgreSQL adapter suite runs against a real server — the port's whole
    # risk surface (SQLSTATE mapping, multi-statement migrations, lexical ordering
    # of TEXT timestamps) is engine behaviour that no fake reproduces. Without
    # PAYMENT_TEST_DB_DSN that suite SKIPS, so a missing service here would go
    # unnoticed as a silent loss of coverage rather than a red build; the coverage
    # gate below is what catches it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      PAYMENT_TEST_DB_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"; exit 1
          fi

      - name: pg migrations are in sync with their sqlite source
        run: |
          python3 scripts/gen-pg-migrations.py
          if ! git diff --quiet -- migrations/pg; then
            echo "migrations/pg is stale — re-run scripts/gen-pg-migrations.py and commit:"
            git diff --stat -- migrations/pg; exit 1
          fi

      - name: test + coverage gate (>85%)
        run: bash scripts/coverage.sh 85

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - name: staticcheck
        run: staticcheck ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  deploy-wrapper:
    name: deploy wrapper (shellcheck + stdin transport guardrail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the deploy wrapper + its test
        run: shellcheck --severity=warning deploy/scripts/payment-deploy.sh deploy/scripts/payment-deploy_test.sh
      - name: payment-deploy.sh guardrail (stdin transport + allow-list)
        run: bash deploy/scripts/payment-deploy_test.sh
